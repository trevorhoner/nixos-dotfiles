game:
  arch: auto
  exe: /home/trevor/Games/Lutris/centipede-1998/drive_c/Program Files (x86)/Hasbro
    Interactive/Centipede/centi.exe
  prefix: /home/trevor/Games/Lutris/centipede-1998
game_slug: centipede-1998
name: Centipede (1998)
script:
  files:
  - setupfile: N/A:Select the setup file
  game:
    exe: _xXx_AUTO_WIN32_xXx_
    prefix: $GAMEDIR
  installer:
  - task:
      arch: win64
      env:
        LC_ALL: ''
      executable: /home/trevor/Games/Lutris/windows/centipede/iso/SETUP.EXE
      prefix: /home/trevor/Games/Lutris/centipede-1998
      wine_path: /etc/profiles/per-user/trevor/bin/wine
  system:
    env:
      LC_ALL: ''
slug: centipede-1998-setup
system:
  env:
    GDK_BACKEND: x11
    LC_ALL: ''
    WINE_WMCLASS: lutris-wine
  gamescope: true
  gamescope_force_grab_cursor: false
  gamescope_window_mode: -f
  resolution: 'off'
version: Setup file
wine:
  Desktop: false
  MouseWarpOverride: enable
  WineDesktop: 800x600
  dxvk: false
  overrides:
    d3d8: n,b
    d3d9: n,b
    d3dimm: n,b
  system_winetricks: false
  version: wine-ge-8-26-x86_64
  vkd3d: false
